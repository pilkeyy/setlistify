# Runs the backend tests and the frontend build on every pull request and every push to main.
# A red check on a PR means "don't merge yet".
name: CI

on:
  pull_request:
  push:
    branches: [main]

# The workflow only reads the repository; it never needs to push or comment.
permissions:
  contents: read

# If you push again to the same branch, cancel the older, now-outdated run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The app reads these at startup (SetlistifyApplicationTests loads the full context).
      # Tests never call the real APIs, so placeholder values are enough; no real secrets in CI.
      SETLIST_FM_KEY: ci-placeholder
      SPOTIFY_CLIENT_ID: ci-placeholder
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven # reuse downloaded dependencies between runs

      # -B = batch mode (no interactive prompts / progress bars in logs).
      # verify compiles, runs all tests, and packages the jar.
      - run: ./mvnw -B verify

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22' # Vite 7 needs Node 20.19+ or 22.12+
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci installs exactly what package-lock.json says (reproducible, unlike npm install).
      - run: npm ci
      - run: npm run build
